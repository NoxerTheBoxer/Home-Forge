<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HomeForge">
<meta name="theme-color" content="#080808">
<title>HomeForge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#080808;--s1:#111;--s2:#1a1a1a;--bd:#252525;
  --tx:#f0f0f0;--mt:#777;--ac:#ff6b35;--ac2:#ff9a1f;
  --grn:#32d74b;--red:#ff453a;--blu:#0a84ff;--pur:#bf5af2;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',-apple-system,sans-serif;font-size:15px;display:flex;flex-direction:column}

.topbar{
  background:linear-gradient(135deg,#111 0%,#1a0a00 100%);
  border-bottom:1px solid rgba(255,107,53,.15);
  padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  flex-shrink:0;position:relative;overflow:hidden;
}
.topbar::before{content:'';position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:radial-gradient(circle,rgba(255,107,53,.12) 0%,transparent 70%);pointer-events:none;}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.app-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.home-badge{font-size:10px;font-weight:600;background:rgba(255,107,53,.1);color:var(--ac);padding:4px 10px;border-radius:20px;border:1px solid rgba(255,107,53,.25);letter-spacing:.05em}

.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0}
.nav-btn{padding:10px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mt);background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .2s}
.nav-btn.active{color:var(--ac)}
.nav-btn.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px}
.nav-icon{font-size:18px}

.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe))}
.panel{display:none;padding:12px 14px}
.panel.active{display:block}

.sess-header{background:linear-gradient(135deg,var(--s1) 0%,#1a0a00 100%);border:1px solid rgba(255,107,53,.2);border-radius:14px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;}
.sess-header::after{content:'';position:absolute;bottom:-20px;right:-20px;width:100px;height:100px;background:radial-gradient(circle,rgba(255,107,53,.08) 0%,transparent 70%);}
.sess-day{font-family:'Bebas Neue',sans-serif;font-size:34px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;line-height:1}
.sess-sub{font-size:12px;color:var(--mt);margin-top:3px;margin-bottom:10px}
.eq-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.eq-pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;background:rgba(255,107,53,.08);color:var(--ac);border:1px solid rgba(255,107,53,.2)}
.prog-label{font-size:11px;color:var(--mt);margin-bottom:4px;display:flex;justify-content:space-between}
.prog-bar{background:var(--bd);height:3px;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:2px;transition:width .4s ease;width:0%}

.sec-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--mt);margin:14px 0 8px;padding:0 2px;display:flex;align-items:center;gap:8px}
.sec-head::after{content:'';flex:1;height:1px;background:var(--bd)}

.ex-card{background:var(--s1);border:1px solid var(--bd);border-radius:13px;margin-bottom:8px;overflow:hidden;transition:border-color .2s,opacity .2s}
.ex-card.done{border-color:rgba(50,215,75,.4);opacity:.6}
.ex-card.warmup{border-color:rgba(10,132,255,.15);background:rgba(10,132,255,.03)}
.ex-card.primer{border-color:rgba(191,90,242,.15);background:rgba(191,90,242,.03)}
.ex-card.superset{border-left:3px solid var(--ac2)}
.ex-card.skill{border-color:rgba(50,215,75,.2);background:rgba(50,215,75,.03)}
.ex-card.finisher{border-color:rgba(255,107,53,.2);background:rgba(255,107,53,.03)}

.ex-main{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:start;padding:12px}
.ex-num{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--bd);line-height:1;transition:color .2s}
.ex-card.done .ex-num{color:var(--grn)}
.ex-card.warmup .ex-num,.ex-card.primer .ex-num{font-size:18px}
.ex-card.warmup .ex-num{color:rgba(10,132,255,.25)}
.ex-card.primer .ex-num{color:rgba(191,90,242,.3)}
.ex-card.skill .ex-num{color:rgba(50,215,75,.3);font-size:20px}

.tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:5px;margin-right:3px;letter-spacing:.04em}
.tag-wu{background:rgba(10,132,255,.1);color:#4da3ff;border:1px solid rgba(10,132,255,.2)}
.tag-pr{background:rgba(191,90,242,.1);color:#d084f7;border:1px solid rgba(191,90,242,.2)}
.tag-ss{background:rgba(255,154,31,.1);color:var(--ac2);border:1px solid rgba(255,154,31,.2)}
.tag-sk{background:rgba(50,215,75,.1);color:var(--grn);border:1px solid rgba(50,215,75,.2)}
.tag-fn{background:rgba(255,107,53,.1);color:var(--ac);border:1px solid rgba(255,107,53,.2)}
.eq-tag{background:rgba(255,255,255,.06);color:#aaa;border:1px solid rgba(255,255,255,.1)}

.ex-name{font-weight:600;font-size:14px;margin-bottom:2px;line-height:1.3}
.ex-gym{font-size:11px;color:var(--mt);margin-bottom:3px;font-style:italic}
.ex-note{font-size:12px;color:#aaa;line-height:1.45}

.ex-right{text-align:right;flex-shrink:0}
.ex-sets{font-size:11px;color:var(--mt);margin-bottom:6px;white-space:nowrap;line-height:1.4}
.rpe{display:inline-block;font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.05em}
.rpe-n{background:rgba(255,69,58,.12);color:var(--red)}
.rpe-c{background:rgba(255,154,31,.12);color:var(--ac2)}
.rpe-y{background:rgba(50,215,75,.12);color:var(--grn)}
.rpe-p{background:rgba(191,90,242,.12);color:var(--pur)}

.ex-actions{display:flex;gap:6px;padding:0 12px 12px}
.ex-btn{flex:1;padding:9px;font-size:12px;font-weight:600;border-radius:9px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer;transition:transform .1s}
.ex-btn:active{transform:scale(.97)}
.rest-btn{background:rgba(255,107,53,.08);color:var(--ac);border-color:rgba(255,107,53,.2)}
.done-btn{background:rgba(50,215,75,.08);color:var(--grn);border-color:rgba(50,215,75,.2)}

.timer-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.timer-ov.show{display:flex}
.t-label{font-size:12px;font-weight:700;color:var(--mt);text-transform:uppercase;letter-spacing:.12em}
.t-circle{width:200px;height:200px;position:relative}
.t-circle svg{width:200px;height:200px;transform:rotate(-90deg)}
.t-track{fill:none;stroke:#1a1a1a;stroke-width:8}
.t-prog{fill:none;stroke:url(#tgrad);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.t-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-secs{font-family:'Bebas Neue',sans-serif;font-size:68px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.t-next{font-size:11px;color:var(--mt);margin-top:4px;text-align:center;padding:0 20px}
.t-btns{display:flex;gap:12px}
.t-btn{padding:14px 28px;font-size:13px;font-weight:700;border-radius:12px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.t-btn.skip{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#000;border:none}

.info-card{background:var(--s1);border:1px solid var(--bd);border-radius:13px;padding:14px;margin-bottom:10px}
.info-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.info-body{font-size:13px;color:#aaa;line-height:1.6}
.p-table{background:var(--s1);border:1px solid var(--bd);border-radius:13px;overflow:hidden;margin-bottom:10px}
.p-head{padding:12px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--bd)}
.p-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);font-size:13px;gap:12px}
.p-row:last-child{border-bottom:none}
.p-val{color:var(--mt);font-size:12px;text-align:right;flex-shrink:0}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
.wk-day{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:7px 3px;text-align:center}
.wk-dn{font-size:9px;font-weight:700;color:var(--mt);margin-bottom:4px;text-transform:uppercase}
.wk-tag{font-size:8px;font-weight:700;padding:2px 3px;border-radius:3px;display:block;margin:1px auto;text-transform:uppercase}
.wt-u{background:rgba(255,107,53,.2);color:var(--ac)}
.wt-l{background:rgba(255,154,31,.2);color:var(--ac2)}
.wt-f{background:rgba(50,215,75,.2);color:var(--grn)}
.wt-b{background:rgba(10,132,255,.2);color:var(--blu)}
.wt-r{background:rgba(255,255,255,.05);color:var(--mt)}

.notif{position:fixed;bottom:calc(24px + var(--safe));left:50%;transform:translateX(-50%) translateY(80px);background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.notif.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="app-title">HomeForge</div>
    <span class="home-badge">DB + Bar + Bands</span>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="go('thu')" id="nav-thu"><span class="nav-icon">🦵</span>Tue · Lower</button>
  <button class="nav-btn" onclick="go('tue')" id="nav-tue"><span class="nav-icon">💪</span>Thu · Upper</button>
  <button class="nav-btn" onclick="go('sat')" id="nav-sat"><span class="nav-icon">⚡</span>Sat · Full</button>
  <button class="nav-btn" onclick="go('info')" id="nav-info"><span class="nav-icon">📋</span>Info</button>
</div>

<div class="main" id="main"></div>

<div class="timer-ov" id="tov">
  <div class="t-label">Rest Timer</div>
  <div class="t-circle">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="tgrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#ff6b35"/><stop offset="100%" style="stop-color:#ff9a1f"/></linearGradient></defs>
      <circle class="t-track" cx="100" cy="100" r="88"/>
      <circle class="t-prog" id="tcirc" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="t-num">
      <div class="t-secs" id="tdis">90</div>
      <div class="t-next" id="tnxt">Next: —</div>
    </div>
  </div>
  <div class="t-btns">
    <button class="t-btn" onclick="stopT()">Cancel</button>
    <button class="t-btn skip" onclick="stopT()">Skip ›</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
var cur='tue', done={}, tInt=null, tSecs=0, tTotal=0, C=553;

var DATA = {
  tue: {
    day:'UPPER BODY',
    sub:'Tuesday · Pull-up bar + 2×35lb + 1×20lb + bands',
    eq:['Pull-Up Bar','2×35lb DB','1×20lb DB','Resistance Bands','Towel'],
    sections:[
      {label:'Warm Up',items:[
        {n:'Arm Circles',type:'warmup',gym:'Arm Circles',eq:'',d:'10 forward and backward. Progressively larger circles. Shoulder joint lubrication.',sets:'10 each direction',rpe:'rpe-p',rf:'Prep',rest:0,next:'Band Pull-Aparts'},
        {n:'Band Pull-Aparts',type:'warmup',gym:'Band Pull-Aparts',eq:'Band',d:'Hold band at shoulder width, pull apart to chest squeezing rear delts. The real band version — not a towel substitute. 20 controlled reps.',sets:'20 reps',rpe:'rpe-p',rf:'Full stretch',rest:0,next:'Shoulder Dislocations'},
        {n:'Shoulder Dislocations with Band',type:'warmup',gym:'Shoulder Dislocations',eq:'Band',d:'Wide grip on band, rotate overhead and behind in one slow arc. Develops overhead mobility your handstand work requires.',sets:'10 reps',rpe:'rpe-p',rf:'Wide grip',rest:0,next:'Wrist Circles'},
        {n:'Wrist Circles',type:'warmup',gym:'Wrist Circles',eq:'',d:'10 each direction. Never skip — BJJ and pressing load wrists constantly.',sets:'10 each direction',rpe:'rpe-p',rf:'Full range',rest:0,next:'Dead Hang'},
        {n:'Dead Hang',type:'warmup',gym:'Dead Hang',eq:'Pull-Up Bar',d:'Full bodyweight hang. Decompress spine, activate grip, stretch lats before pulling work.',sets:'45 seconds',rpe:'rpe-p',rf:'Relax shoulders',rest:0,next:'Handstand Wall Hold'}
      ]},
      {label:'Primer',items:[
        {n:'Handstand Wall Hold',type:'primer',gym:'Handstand Wall Hold',eq:'',d:'Walk feet up wall until vertical. Ears between arms, core tight. Activates shoulder stabilisers and body tension before all upper body work.',sets:'3 × 30 seconds',rpe:'rpe-p',rf:'Body tight',rest:30,next:'Explosive Pull-Ups'},
        {n:'Explosive High Pull-Ups',type:'primer',gym:'Explosive High Pull-Ups',eq:'Pull-Up Bar',d:'Maximum speed every rep. Chin well above the bar. Neurological potentiation before heavier pulling work.',sets:'2 × 3–5',rpe:'rpe-p',rf:'Max speed',rest:60,next:'Towel Pull-Ups'}
      ]},
      {label:'Main Pulling',items:[
        {n:'Towel Pull-Ups',type:'main',gym:'Towel Weighted Pull-Ups',eq:'Pull-Up Bar + Towel',d:'Throw a towel over the bar and grip both ends — exact gi lapel grip demand. Add a 35lb dumbbell held between your feet or thighs for progressive overload. 3 to 4 second eccentric on every rep. Your most important BJJ-specific exercise in this programme.',sets:'4 × 5–8',rpe:'rpe-n',rf:'Never fail',rest:150,next:'DB Floor Press'}
      ]},
      {label:'Superset — Push + Shoulder Health',items:[
        {n:'DB Floor Press',type:'superset',gym:'Incline DB Bench Press',eq:'2×35lb DB',d:'Lie on floor with 35lb dumbbells. Press from floor — the floor contact limits range of motion at the bottom which actually reduces shoulder stress. Superset immediately with band pull-aparts. Elbows at 45 degrees from your torso.',sets:'3 × 8–12',rpe:'rpe-c',rf:'1–2 RIR',rest:0,next:'Band Pull-Aparts'},
        {n:'Band Pull-Aparts',type:'superset',gym:'Band Pull-Aparts',eq:'Band',d:'Immediately after DB floor press — zero rest. Rear delt activation between pressing sets. Full stretch at end range every rep.',sets:'3 × 20',rpe:'rpe-y',rf:'Full stretch',rest:90,next:'DB Row'}
      ]},
      {label:'Superset — Row + Face Pull',items:[
        {n:'Single Arm DB Row',type:'superset',gym:'Barbell Rows',eq:'35lb DB',d:'Brace one hand and knee on a chair or sofa. Row the 35lb dumbbell from a dead hang to hip. Full stretch at bottom — do not cheat the range. 4 sets at 35lbs. When too easy hold both 35lb DBs alternating. Superset immediately with band face pulls.',sets:'4 × 10–12 each arm',rpe:'rpe-c',rf:'1–2 RIR',rest:0,next:'Band Face Pulls'},
        {n:'Band Face Pulls',type:'superset',gym:'Face Pulls',eq:'Band',d:'Attach band to door handle or pull-up bar. Pull ends toward face with elbows flaring wide. Rear delt and external rotator health. Non-negotiable for shoulder longevity alongside heavy pressing and BJJ.',sets:'3 × 15–20',rpe:'rpe-y',rf:'Last set fail',rest:90,next:'Pike Push-Up'}
      ]},
      {label:'Direct Push',items:[
        {n:'Pike Push-Up to Chair Dip',type:'main',gym:'Weighted Dips',eq:'Chair',d:'If bodyweight dips feel light put your feet elevated on a chair with hands on another chair behind you and place a 35lb dumbbell on your lap. Otherwise pike push-ups with feet elevated on a chair. Both replicate the pressing strength demand of weighted dips.',sets:'3 × 8–12',rpe:'rpe-c',rf:'1–2 RIR',rest:90,next:'DB Curl'}
      ]},
      {label:'Superset — Direct Arm Work',items:[
        {n:'DB Incline Curl',type:'superset',gym:'Incline DB Curl',eq:'20lb DB',d:'Sit on a chair tilted back slightly — lean back against a wall at an angle. Hang the 20lb dumbbell at full arm extension, curl slowly. The stretch position at the bottom develops the long head of the bicep specifically.',sets:'2 × 12',rpe:'rpe-y',rf:'Last set fail',rest:0,next:'DB Hammer Curl'},
        {n:'DB Hammer Curl',type:'superset',gym:'Hammer Curl',eq:'20lb DB',d:'Neutral grip on the 20lb dumbbell. Develops brachialis and forearm thickness for gi grip strength. Immediately after incline curls.',sets:'2 × 12',rpe:'rpe-y',rf:'Last set fail',rest:60,next:'Tuck Front Lever'}
      ]},
      {label:'Calisthenics Skill + Grip',items:[
        {n:'Tuck Front Lever Hold',type:'skill',gym:'Tuck Front Lever Hold',eq:'Pull-Up Bar',d:'From bar bring knees to chest and hold horizontal. Accumulate 8 seconds per set. Progress: tuck → advanced tuck → one leg extended → full front lever.',sets:'3 × 8 seconds',rpe:'rpe-p',rf:'Accumulate',rest:60,next:'Towel Wringing'},
        {n:'Towel Wringing Grip Work',type:'skill',gym:'Wrist Conditioning',eq:'Towel',d:'Take a dry towel and wring both hands in opposite directions as hard as possible. 30 seconds maximum effort. Direct gi grip endurance training. Alternatively hang from the bar with a towel grip for 30 second holds.',sets:'3 × 30 seconds',rpe:'rpe-y',rf:'Burn out',rest:0,next:'Done'}
      ]}
    ]
  },

  thu: {
    day:'LOWER BODY',
    sub:'Thursday · Pull-up bar + 2×35lb + 1×20lb + bands',
    eq:['Pull-Up Bar','2×35lb DB','1×20lb DB','Chair or Sofa','Resistance Band'],
    sections:[
      {label:'Warm Up',items:[
        {n:'90/90 Hip Stretch',type:'warmup',gym:'90/90 Hip Stretch',eq:'',d:'Most important BJJ mobility exercise. Both legs at 90 degrees. 2 minutes each side. Breathe into the stretch.',sets:'2 min each side',rpe:'rpe-p',rf:'Sink deep',rest:0,next:'Hip Circles'},
        {n:'Hip Circles',type:'warmup',gym:'Hip Circles',eq:'',d:'Standing on one leg, trace large circles with raised knee.',sets:'10 each direction each leg',rpe:'rpe-p',rf:'Full range',rest:0,next:'Leg Swings'},
        {n:'Leg Swings',type:'warmup',gym:'Leg Swings',eq:'',d:'Hold wall, swing leg forward and back through full range.',sets:'15 each leg',rpe:'rpe-p',rf:'Full range',rest:0,next:'Deep Squat Hold'},
        {n:'Deep Squat Hold',type:'warmup',gym:'Deep Squat Hold',eq:'',d:'Full depth squat heels flat, elbows pushing knees out. Hold at bottom for ankle dorsiflexion.',sets:'60 seconds',rpe:'rpe-p',rf:'Heels flat',rest:0,next:'Ankle Circles'},
        {n:'Ankle Circles',type:'warmup',gym:'Ankle Circles',eq:'',d:'10 each direction.',sets:'10 each direction',rpe:'rpe-p',rf:'Full range',rest:0,next:'Goblet Squat Primer'}
      ]},
      {label:'Primer',items:[
        {n:'Goblet Squat with Pause',type:'primer',gym:'Goblet Squat with Pause',eq:'20lb DB',d:'Hold 20lb dumbbell at chest. 3 second pause at bottom every rep. Grooves the squat pattern. Elbows up, chest tall, heels flat.',sets:'2 × 5',rpe:'rpe-p',rf:'Perfect form',rest:60,next:'DB Goblet Squat'}
      ]},
      {label:'Main Work',items:[
        {n:'DB Goblet Squat',type:'main',gym:'Barbell Front Squat',eq:'35lb DB',d:'Hold a 35lb dumbbell at your chest goblet style. Full depth every rep — thighs below parallel. When 35lbs becomes easy hold both 35lb DBs in a front rack position — 70lbs total at chest. This is a genuine load that challenges your legs meaningfully. Upright torso maintained by the front loading.',sets:'4 × 8–12',rpe:'rpe-n',rf:'Never fail',rest:180,next:'DB Romanian Deadlift'},
        {n:'DB Romanian Deadlift',type:'main',gym:'Romanian Deadlift',eq:'2×35lb DB',d:'Both 35lb dumbbells in hands, hinge at hip, feel the hamstring stretch at the bottom. 3 second eccentric every rep. 70lbs total is a real training load — you will feel this. Keep back flat, soft bend in knees throughout.',sets:'3 × 8–10',rpe:'rpe-c',rf:'1–2 RIR',rest:120,next:'Sofa Nordic Curl'},
        {n:'Sofa Nordic Hamstring Curl',type:'main',gym:'Nordic Hamstring Curl',eq:'Sofa',d:'Kneel on mat and tuck feet under a heavy sofa or have someone hold your ankles. Lower body toward floor as slowly as possible — 5 to 8 seconds down. Catch yourself with hands. Drive back up using hands to assist. Identical to the gym Nordic. The single best hamstring injury prevention exercise available.',sets:'3 × 4–6 negatives',rpe:'rpe-c',rf:'As slow as possible',rest:120,next:'DB Bulgarian Split Squat'},
        {n:'DB Bulgarian Split Squat',type:'main',gym:'Bulgarian Split Squat',eq:'2×35lb DB + Chair',d:'Rear foot elevated on chair. Hold 35lb dumbbells in each hand — 70lbs total. This is a serious weighted BSS. Front foot far enough forward that shin stays vertical. Control the descent fully.',sets:'3 × 8–10 each leg',rpe:'rpe-c',rf:'1–2 RIR',rest:90,next:'Tibialis Raise'}
      ]},
      {label:'Superset — Lower Leg',items:[
        {n:'Tibialis Raise',type:'superset',gym:'Tibialis Raise',eq:'',d:'Back against wall, heels 6 inches out. Lift balls of feet as high as possible, 1 second hold. No equipment needed.',sets:'3 × 15–20',rpe:'rpe-y',rf:'Last set fail',rest:0,next:'DB Calf Raise'},

function countEx(sess){var t=0;DATA[sess].sections.forEach(function(s){s.items.forEach(function(i){if(i.type!=='warmup')t++;});});return t;}
function countDone(sess){var t=0;DATA[sess].sections.forEach(function(s,si){s.items.forEach(function(i,ii){if(i.type!=='warmup'&&done[sess+'-'+si+'-'+ii])t++;});});return t;}

function render(s){
  var main=document.getElementById('main');
  if(s==='info'){main.innerHTML=renderInfo();return;}
  var d=DATA[s];if(!d)return;
  var tot=countEx(s),dn=countDone(s),pct=Math.round(dn/tot*100);

  var h='<div style="padding:12px 14px">';
  h+='<div class="sess-header">';
  h+='<div class="sess-day">'+d.day+'</div>';
  h+='<div class="sess-sub">'+d.sub+'</div>';
  h+='<div class="eq-strip">';
  d.eq.forEach(function(e){h+='<span class="eq-pill">'+e+'</span>';});
  h+='</div>';
  h+='<div class="prog-label"><span>Progress</span><span id="prog-lbl">'+dn+' / '+tot+'</span></div>';
  h+='<div class="prog-bar"><div class="prog-fill" id="pfill" style="width:'+pct+'%"></div></div>';
  h+='</div>';

  d.sections.forEach(function(sec,si){
    h+='<div class="sec-head">'+sec.label+'</div>';
    sec.items.forEach(function(item,ii){
      var key=s+'-'+si+'-'+ii;
      var isMain=item.type!=='warmup';
      var isDone=done[key]?' done':'';
      var cls='ex-card';
      if(item.type==='warmup')cls+=' warmup';
      else if(item.type==='primer')cls+=' primer';
      else if(item.type==='superset')cls+=' superset';
      else if(item.type==='skill')cls+=' skill';
      else if(item.type==='finisher')cls+=' finisher';

      h+='<div id="ec'+key+'" class="'+cls+isDone+'">';
      h+='<div class="ex-main">';
      var num='';
      if(item.type==='warmup')num='○';
      else if(item.type==='primer')num='◈';
      else if(item.type==='skill')num='★';
      else if(item.type==='finisher')num='⟳';
      else num=(ii+1);
      h+='<div class="ex-num">'+num+'</div>';
      h+='<div>';
      if(item.type==='warmup')h+='<span class="tag tag-wu">Warm Up</span>';
      else if(item.type==='primer')h+='<span class="tag tag-pr">Primer</span>';
      else if(item.type==='superset')h+='<span class="tag tag-ss">Superset</span>';
      else if(item.type==='skill')h+='<span class="tag tag-sk">Skill</span>';
      else if(item.type==='finisher')h+='<span class="tag tag-fn">Finisher</span>';
      if(item.eq)h+='<span class="tag eq-tag">'+item.eq+'</span>';
      h+='<div class="ex-name">'+item.n+'</div>';
      h+='<div class="ex-gym">Gym: '+item.gym+'</div>';
      h+='<div class="ex-note">'+item.d+'</div>';
      h+='</div>';
      h+='<div class="ex-right"><div class="ex-sets">'+item.sets+'</div>';
      h+='<span class="rpe '+item.rpe+'">'+item.rf+'</span></div>';
      h+='</div>';
      h+='<div class="ex-actions">';
      if(item.rest>0){h+='<button class="ex-btn rest-btn" onclick="startT('+item.rest+',\''+item.next.replace(/'/g,"\\'")+'\')" >Rest '+fmtR(item.rest)+'</button>';}
      else{h+='<button class="ex-btn" style="opacity:.35;cursor:default">No rest</button>';}
      h+='<button class="ex-btn done-btn" onclick="markEx(\''+key+'\',\''+s+'\')">✓ Done</button>';
      h+='</div></div>';
    });
  });
  h+='</div>';
  main.innerHTML=h;
}

    '<div class="info-card"><div class="info-title" style="color:var(--ac)">Progressive Overload at Home</div><div class="info-body">Your dumbbells are fixed weight. Progress through tempo manipulation — slower eccentrics make the same weight harder. Add reps before adding load. Use both 35lb DBs for bilateral work and single 35lb for unilateral. When both 35s feel light for an exercise wear a loaded backpack simultaneously.</div></div>'+

function fmtR(s){if(s>=60&&s%60===0)return(s/60)+'min';if(s>=60)return Math.floor(s/60)+'m'+(s%60)+'s';return s+'s';}

function go(s){
  cur=s;
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active')});
  document.getElementById('nav-'+s).classList.add('active');
  render(s);
  document.getElementById('main').scrollTop=0;
}

function markEx(key,sess){
  done[key]=true;
  var card=document.getElementById('ec'+key);
  if(card)card.classList.add('done');
  var tot=countEx(sess),dn=countDone(sess),pct=Math.round(dn/tot*100);
  var fill=document.getElementById('pfill');
  var lbl=document.getElementById('prog-lbl');
  if(fill)fill.style.width=pct+'%';
  if(lbl)lbl.textContent=dn+' / '+tot;
  showN('Done ✓');
  if(dn===tot)setTimeout(function(){showN('🔥 Session complete!');},800);
}

function startT(secs,next){
  tTotal=secs;tSecs=secs;
  document.getElementById('tdis').textContent=secs;
  document.getElementById('tnxt').textContent='Next: '+next;
  document.getElementById('tcirc').style.strokeDashoffset='0';
  document.getElementById('tov').classList.add('show');
  clearInterval(tInt);
  tInt=setInterval(function(){
    tSecs--;
    document.getElementById('tdis').textContent=tSecs;
    document.getElementById('tcirc').style.strokeDashoffset=C*(1-tSecs/tTotal);
    if(tSecs<=0){stopT();showN('Rest done — go!');}
  },1000);
}

function stopT(){clearInterval(tInt);document.getElementById('tov').classList.remove('show');}

function showN(msg){
  var n=document.getElementById('notif');
  n.textContent=msg;n.classList.add('show');
  setTimeout(function(){n.classList.remove('show');},2500);
}

render('thu');

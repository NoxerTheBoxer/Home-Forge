<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HomeForge">
<meta name="theme-color" content="#080808">
<title>HomeForge v4</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--s1:#101010;--s2:#181818;--bd:#242424;
  --tx:#F2EFE9;--mt:#606060;--ac:#C8F135;--ac2:#A8D420;
  --red:#FF4444;--blu:#4A9EFF;--pur:#BF7EFF;--ora:#FF8C42;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'DM Sans',-apple-system,sans-serif}
.layout{display:flex;flex-direction:column;height:100%}

/* TOPBAR */
.topbar{
  background:var(--s1);
  border-bottom:1px solid var(--bd);
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--tx)}
.logo span{color:var(--ac)}
.ver-badge{font-size:10px;font-weight:600;background:rgba(200,241,53,.1);color:var(--ac);padding:3px 10px;border-radius:20px;border:1px solid rgba(200,241,53,.25);letter-spacing:.06em;font-family:'DM Mono',monospace}

/* NAV */
.nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-bottom:1px solid var(--bd);flex-shrink:0}
.nb{padding:10px 4px 8px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mt);background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .2s;font-family:'DM Sans',sans-serif}
.nb.active{color:var(--ac)}
.nb.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:2px;background:var(--ac);border-radius:2px}
.ni{font-size:17px}

/* MAIN */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + var(--safe))}
.page{display:none;padding:12px 14px}
.page.active{display:block}

/* SECTION */
.sec{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--mt);margin:14px 0 8px;display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace}
.sec::after{content:'';flex:1;height:1px;background:var(--bd)}

/* SESSION HEADER */
.sess-hd{border-radius:14px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden}
.sess-hd.mon{background:linear-gradient(135deg,#0E1A00,#080808);border:1px solid rgba(200,241,53,.2)}
.sess-hd.wed{background:linear-gradient(135deg,#001020,#080808);border:1px solid rgba(74,158,255,.2)}
.sess-hd.fri{background:linear-gradient(135deg,#1A0A00,#080808);border:1px solid rgba(255,140,66,.2)}
.sess-day{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:1px;line-height:1}
.sess-day.mon{color:var(--ac)}
.sess-day.wed{color:var(--blu)}
.sess-day.fri{color:var(--ora)}
.sess-title{font-size:12px;color:var(--mt);margin-top:2px;margin-bottom:10px;font-family:'DM Mono',monospace}
.sess-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--mt);margin-bottom:4px}
.prog-bar{background:var(--bd);height:3px;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .5s ease;width:0%}
.pf-mon{background:var(--ac)}
.pf-wed{background:var(--blu)}
.pf-fri{background:var(--ora)}

/* EXERCISE CARDS */
.ex{background:var(--s1);border:1px solid var(--bd);border-radius:13px;margin-bottom:8px;overflow:hidden;transition:opacity .2s,border-color .2s}
.ex.done{opacity:.5;border-color:rgba(200,241,53,.3)}
.ex.superset{border-left:3px solid var(--pur)}
.ex.skill{border-color:rgba(200,241,53,.15);background:rgba(200,241,53,.02)}
.ex.rehab{border-color:rgba(255,68,68,.15);background:rgba(255,68,68,.02)}
.ex.mob{border-color:rgba(74,158,255,.12);background:rgba(74,158,255,.02)}
.ex-inner{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:start;padding:12px}
.ex-n{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--bd);line-height:1;transition:color .2s}
.ex.done .ex-n{color:var(--ac)}
.ex-body{}
.tag{display:inline-block;font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;margin-bottom:4px;margin-right:3px;font-family:'DM Mono',monospace;letter-spacing:.03em}
.t-ss{background:rgba(191,126,255,.1);color:var(--pur);border:1px solid rgba(191,126,255,.2)}
.t-sk{background:rgba(200,241,53,.08);color:var(--ac);border:1px solid rgba(200,241,53,.2)}
.t-rh{background:rgba(255,68,68,.08);color:var(--red);border:1px solid rgba(255,68,68,.2)}
.t-mb{background:rgba(74,158,255,.08);color:var(--blu);border:1px solid rgba(74,158,255,.2)}
.t-pw{background:rgba(255,140,66,.1);color:var(--ora);border:1px solid rgba(255,140,66,.2)}
.ex-name{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:3px;line-height:1.3}
.ex-desc{font-size:12px;color:#888;line-height:1.5}
.ex-prog{font-size:11px;color:var(--ac);margin-top:4px;font-style:italic}
.ex-right{text-align:right;flex-shrink:0}
.ex-sets{font-size:11px;color:var(--mt);margin-bottom:6px;line-height:1.4;white-space:nowrap}
.rpe{display:inline-block;font-size:9px;font-weight:600;padding:3px 7px;border-radius:4px;font-family:'DM Mono',monospace}
.rpe-h{background:rgba(255,68,68,.1);color:var(--red)}
.rpe-m{background:rgba(255,140,66,.1);color:var(--ora)}
.rpe-l{background:rgba(200,241,53,.1);color:var(--ac)}
.rpe-s{background:rgba(74,158,255,.1);color:var(--blu)}
.ex-btns{display:flex;gap:6px;padding:0 12px 12px}
.btn-rest{flex:1;padding:9px;font-size:12px;font-weight:600;border-radius:9px;border:1px solid rgba(200,241,53,.2);background:rgba(200,241,53,.06);color:var(--ac);cursor:pointer;transition:transform .1s}
.btn-done{flex:1;padding:9px;font-size:12px;font-weight:600;border-radius:9px;border:1px solid var(--bd);background:var(--s2);color:var(--tx);cursor:pointer;transition:transform .1s}
.btn-rest:active,.btn-done:active{transform:scale(.97)}

/* TIMER */
.tov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.tov.show{display:flex}
.t-lbl{font-size:11px;font-weight:600;color:var(--mt);text-transform:uppercase;letter-spacing:.1em;font-family:'DM Mono',monospace}
.t-ring{width:200px;height:200px;position:relative}
.t-ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.t-track{fill:none;stroke:#1a1a1a;stroke-width:8}
.t-arc{fill:none;stroke:var(--ac);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.t-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-secs{font-family:'Bebas Neue',sans-serif;font-size:72px;color:var(--ac);line-height:1}
.t-next{font-size:11px;color:var(--mt);margin-top:2px;text-align:center;padding:0 16px}
.t-btns{display:flex;gap:10px}
.t-btn{padding:13px 26px;font-size:13px;font-weight:600;border-radius:12px;border:1px solid var(--bd);background:var(--s1);color:var(--tx);cursor:pointer;letter-spacing:.04em}
.t-btn.go{background:var(--ac);color:#000;border:none}

/* OVERVIEW */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}
.stat-v{font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--ac);line-height:1;margin-bottom:4px}
.stat-l{font-size:10px;color:var(--mt);text-transform:uppercase;letter-spacing:.06em;font-family:'DM Mono',monospace}
.day-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.day-row:last-child{border-bottom:none}
.day-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-info{}
.day-name{font-size:13px;font-weight:600;color:var(--tx)}
.day-sub{font-size:11px;color:var(--mt);margin-top:1px}
.prog-list{margin-top:10px}
.pl-item{margin-bottom:8px}
.pl-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px}
.pl-label{color:var(--tx);font-weight:500}
.pl-val{color:var(--mt)}
.pl-bar{background:var(--bd);height:4px;border-radius:2px;overflow:hidden}
.pl-fill{height:100%;border-radius:2px}

/* NOTIF */
.notif{position:fixed;bottom:calc(20px + var(--safe));left:50%;transform:translateX(-50%) translateY(70px);background:var(--ac);color:#000;font-size:12px;font-weight:700;padding:9px 18px;border-radius:20px;z-index:200;transition:transform .3s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;font-family:'DM Mono',monospace}
.notif.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="layout">

<div class="topbar">
  <div class="logo">Home<span>Forge</span></div>
  <span class="ver-badge">v4 · MWF · Fresh</span>
</div>

<div class="nav">
  <button class="nb active" onclick="go('mon')" id="nb-mon"><span class="ni">🦵</span>Monday</button>
  <button class="nb" onclick="go('wed')" id="nb-wed"><span class="ni">💪</span>Wednesday</button>
  <button class="nb" onclick="go('fri')" id="nb-fri"><span class="ni">⚡</span>Friday</button>
  <button class="nb" onclick="go('info')" id="nb-info"><span class="ni">📋</span>Info</button>
</div>

<div class="main" id="main"></div>

<div class="tov" id="tov">
  <div class="t-lbl">Rest Timer</div>
  <div class="t-ring">
    <svg viewBox="0 0 200 200"><circle class="t-track" cx="100" cy="100" r="88"/><circle class="t-arc" id="tarc" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="0"/></svg>
    <div class="t-center"><div class="t-secs" id="tsec">90</div><div class="t-next" id="tnxt"></div></div>
  </div>
  <div class="t-btns">
    <button class="t-btn" onclick="stopT()">Cancel</button>
    <button class="t-btn go" onclick="stopT()">Skip ›</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
var C=553, tInt=null, tSecs=0, tTotal=0;
var done={};

var DATA={
  mon:{
    label:'LOWER BODY',
    sub:'Monday · Lower + Core · ~55 min · Train Fresh',
    cls:'mon',
    eq:['2×35lb DB','1×20lb DB','Pull-Up Bar','Sofa/Chair'],
    exercises:[
      {n:'Single Leg Romanian Deadlift',sets:'4×10 each leg',rpe:'rpe-m',rf:'1–2 RIR',rest:90,next:'Bulgarian Split Squat',
       desc:'35lb DB in opposite hand. Push hips back — feel hamstring stretch at bottom. Full hip extension at top. 4 second eccentric every rep. Balance is the challenge at your bodyweight.',
       prog:'Progress → both 35lb DBs · then add 2 sec pause at bottom'},
      {n:'Bulgarian Split Squat',sets:'4×10 each leg',rpe:'rpe-m',rf:'1–2 RIR',rest:90,next:'Nordic Hamstring Curl',
       desc:'Both 35lb DBs in hands. Rear foot on sofa. FRONT FOOT FLAT — no toes — protects big toe tendinitis. 3 second eccentric. 70lbs at single leg is serious work at 150lbs.',
       prog:'Progress → deficit BSS front foot on book · then pause at bottom'},
      {n:'Nordic Hamstring Curl',sets:'4×5 negatives',rpe:'rpe-h',rf:'6 sec down',rest:120,next:'Calf + Tibialis Superset',
       desc:'Feet under sofa. Lower as slowly as possible — 6 full seconds. Catch with both hands. Push back up with hands. The single most important injury prevention exercise for your BJJ future.',
       prog:'Progress → 8 sec negatives · reduce hand assist · full bodyweight no assist'},
      {n:'Calf Raise + Tibialis Raise',sets:'3 supersets',rpe:'rpe-m',rf:'Superset',rest:60,next:'Single Leg Hip Thrust',
       desc:'SUPERSET — zero rest between movements. Calf raise on stair edge with 35lb DB for balance — full range heel below step — 12 reps. Immediately into Tibialis raise — back against wall heels 6 inches out lift balls of feet — 1 sec hold — 20 reps. Big toe tendinitis note — reduce range if left toe is sharp.',
       prog:'Progress → single leg calf raise · then weighted single leg',
       tag:'ss'},
      {n:'Single Leg Hip Thrust',sets:'4×12 each side',rpe:'rpe-m',rf:'2 sec squeeze',rest:60,next:'Pistol Squat Progression',
       desc:'Upper back on sofa. One foot flat — drive through heel. Other leg extended or crossed. 2 second hard squeeze at top. No toe loading. Glute development directly transfers to hip extension in takedowns and bridging.',
       prog:'Progress → 20lb DB on hip · then 35lb DB · then both 35s'},
      {n:'Pistol Squat Progression',sets:'3×5 each leg',rpe:'rpe-m',rf:'Full depth',rest:90,next:'Dragon Flag',
       desc:'Hold pull-up bar upright for balance. Lower to full depth on one leg. Stand back up. At 150lbs this progression moves fast. Focus on depth — thigh below parallel — before removing the hand assistance.',
       prog:'Progress → unassisted · then 20lb DB held · then 35lb DB',
       tag:'sk'},
      {n:'Dragon Flag',sets:'4 sets to technical failure',rpe:'rpe-h',rf:'Tuck first',rest:90,next:'Dead Bug',
       desc:'Lie on floor. Grip sofa legs behind head. Rigid body — lower as slowly as possible. TUCK first — knees to chest. When tuck is easy extend one leg. Primary core exercise. At 150lbs you will progress to full dragon flag faster than a heavier person.',
       prog:'Progress → tuck → single leg extended → full → 2 sec pause at bottom'},
      {n:'Dead Bug',sets:'3×10 each side',rpe:'rpe-l',rf:'3 sec eccentric',rest:45,next:'Neck Work',
       desc:'Lying on back. Arms toward ceiling. Legs at 90 degrees. Lower opposite arm and leg slowly — keep lower back PRESSED to floor at all times. Develops deep core stability that dragon flag does not reach.',
       prog:'Progress → extend fully · then add resistance band on feet'},
      {n:'Manual Resistance Neck',sets:'3×15 all 4 directions',rpe:'rpe-l',rf:'Controlled',rest:0,next:'Done',
       desc:'Palm against forehead — push against resistance — forward flexion. Back of head — extension. Left temple — left lateral. Right temple — right lateral. Flow through all four with no rest between directions. Non-negotiable from Day 1.',
       prog:'Maintain forever — never skip this'}
    ]
  },
  wed:{
    label:'UPPER BODY',
    sub:'Wednesday · Upper + Calisthenics · ~55 min · Train Fresh',
    cls:'wed',
    eq:['2×35lb DB','1×20lb DB','Pull-Up Bar','Resistance Band','Towel'],
    exercises:[
      {n:'Weighted Pull-Up',sets:'4×max reps',rpe:'rpe-h',rf:'4 sec down',rest:120,next:'Towel Pull-Up Volume',
       desc:'20lb dumbbell between feet. 4 second eccentric every rep. At 8–12 bodyweight pull-ups you are ready for weighted immediately. 20lbs makes your effective weight 170lbs. When you hit 8 clean reps with 20lbs step up to 35lbs.',
       prog:'Progress → 20lb → 35lb → towel grip weighted → archer pull-up weighted'},
      {n:'Towel Pull-Up — Volume',sets:'2×max reps',rpe:'rpe-m',rf:'3 sec down',rest:90,next:'Pike Push-Up + Band Pull-Apart',
       desc:'Throw towel over bar — grip both ends. Bodyweight only — these follow your weighted sets. 3 second eccentric. The towel grip is 20–30% harder than regular pull-ups and directly develops the gi collar grip strength your BJJ will demand.',
       prog:'Progress → longer towel for more instability · then single towel one hand'},
      {n:'Pike Push-Up + Band Pull-Apart',sets:'4 supersets',rpe:'rpe-m',rf:'Superset',rest:90,next:'Single Arm DB Row',
       desc:'SUPERSET — feet on sofa — hips high — head between hands at bottom — 3 sec eccentric — max reps. Immediately into band pull-aparts — 25 reps — arms straight — full stretch. At 150lbs your pike push-up will progress to wall handstand push-up negatives within weeks.',
       prog:'Progress → feet higher on wall → wall HSPU negative → wall HSPU',
       tag:'ss'},
      {n:'Single Arm DB Row',sets:'4×12 each arm',rpe:'rpe-m',rf:'Dead stop',rest:60,next:'Floor Press',
       desc:'35lb DB. Brace knee and hand on sofa. DEAD STOP at floor every single rep — no bouncing. Full scapular stretch at bottom. Full retraction at top. 3 second eccentric. 1 second pause at top. The dead stop makes 35lbs genuinely challenging.',
       prog:'Progress → pause 2 sec at top · then both DBs alternating'},
      {n:'Floor Press',sets:'3×12',rpe:'rpe-m',rf:'2 sec pause',rest:90,next:'Front Lever Progression',
       desc:'Both 35lb DBs. Elbows 45 degrees from torso. 3 second eccentric. 2 second PAUSE at floor — arms resting — then press. The dead stop eliminates the stretch reflex. 70lbs with a pause is real pressing work.',
       prog:'Progress → 3 sec pause · then single arm 35lb floor press'},
      {n:'Front Lever Progression',sets:'4×10 sec accumulation',rpe:'rpe-l',rf:'Accumulate',rest:75,next:'Hollow to Arch Body',
       desc:'From pull-up bar. Tuck hold — knees to chest — hold horizontal. Each set accumulate 10 seconds total. At 150lbs your front lever will progress significantly faster than a heavier person. Advanced tuck within a month. Single leg extended within 2–3 months.',
       prog:'Progress → tuck → advanced tuck → single leg → straddle → full',
       tag:'sk'},
      {n:'Hollow Body + Arch Hold',sets:'3 rounds',rpe:'rpe-l',rf:'30+15 sec',rest:60,next:'Grip Endurance',
       desc:'Hollow body — arms and legs extended — lower back pressed to floor — hold 30 seconds. Immediately flip face down — arch body — arms and legs lifted — hold 15 seconds. Develops the full-body tension that makes every push and pull movement stronger.',
       prog:'Progress → increase hold durations · then add small weight to hands'},
      {n:'Towel Hang — Grip Endurance',sets:'2×max time',rpe:'rpe-h',rf:'Do not let go',rest:90,next:'Done',
       desc:'Hang from towel over pull-up bar. Do not let go until you must. Directly trains the grip endurance your gi BJJ demands in the final rounds when everyone else is losing their grip. Your forearms will burn. That is the point.',
       prog:'Progress → longer hang time · then single towel one arm · then single arm hang'}
    ]
  },
  fri:{
    label:'POWER + SKILL',
    sub:'Friday · Power + Skill + Rehab · ~50 min · Train Fresh',
    cls:'fri',
    eq:['2×35lb DB','1×20lb DB','Pull-Up Bar'],
    exercises:[
      {n:'Broad Jump',sets:'5×4 reps',rpe:'rpe-h',rf:'Max distance',rest:120,next:'DB Push Press',
       desc:'Full effort. Land softly. FULL recovery between reps — walk back slowly. This is power development not conditioning. The explosive hip extension here is identical to the hip drive in takedowns and guard sweeps. Every rep maximum intent.',
       prog:'Progress → measure distance and beat it · then depth jump from step',
       tag:'pw'},
      {n:'DB Push Press',sets:'4×6',rpe:'rpe-h',rf:'Explosive',rest:120,next:'DB Suitcase Deadlift',
       desc:'Both 35lb DBs at shoulders. Dip with legs — drive hips — press overhead explosively. The leg drive is the point — training the kinetic chain from ground to overhead. At 150lbs pressing 70lbs overhead is a genuine power movement.',
       prog:'Progress → pause overhead 2 sec · then single arm alternating',
       tag:'pw'},
      {n:'DB Suitcase Deadlift',sets:'4×8',rpe:'rpe-m',rf:'Explosive up',rest:90,next:'Tiptoe Farmer Walk',
       desc:'Both 35lb DBs at sides. 3 second eccentric. EXPLOSIVE concentric — drive the floor away. Full hip extension and glute squeeze at top. At 150lbs the 70lb suitcase DL with slow eccentric and explosive concentric develops serious posterior chain power.',
       prog:'Progress → pause at bottom · then single leg version'},
      {n:'Tiptoe Farmer Walk',sets:'5×30 metres',rpe:'rpe-m',rf:'Stay on toes',rest:75,next:'Turkish Get-Up',
       desc:'Both 35lb DBs. RISE onto toes — walk the full distance on tiptoes only. Deliberate and controlled. Trains calf strength, balance, ankle stability, AND progressively loads and rehabilitates the big toe tendinitis. If left toe sharp pain — drop to flat foot for that set.',
       prog:'Progress → increase distance · then increase pace · then single arm tiptoe'},
      {n:'Turkish Get-Up',sets:'3×3 each side',rpe:'rpe-l',rf:'Perfect form',rest:0,next:'Tuck Back Lever',
       desc:'20lb dumbbell overhead. Lie to standing while keeping DB pressed overhead throughout. No rushing between positions. Every position requires full core tension. At 150lbs the 20lb TGU is approximately 13% of your bodyweight overhead through a complex movement.',
       prog:'Progress → 35lb DB TGU when 20lb feels fully controlled'},
      {n:'Tuck Back Lever',sets:'3×8 sec accumulation',rpe:'rpe-l',rf:'Accumulate',rest:60,next:'Big Toe Rehab',
       desc:'From pull-up bar. Pull body horizontal behind bar in tuck position. Accumulate 8 seconds per set. Pairs with Wednesday front lever. Together they develop complete ring and bar strength. At 150lbs this is achievable within the first month.',
       prog:'Progress → tuck → advanced tuck → single leg → full back lever',
       tag:'sk'},
      {n:'Big Toe Tendinitis Rehab',sets:'Every Friday',rpe:'rpe-l',rf:'Non-negotiable',rest:0,next:'Hip 90/90 Mobility',
       desc:'1. Seated toe extension stretch — pull big toe gently upward — hold 20 seconds — 3 times each foot. 2. Towel toe curl — scrunch towel with toes — 3×15 each foot. 3. Wall calf stretch — 2×30 seconds each side. Consistent weekly rehab prevents this becoming chronic when BJJ starts.',
       tag:'rh'},
      {n:'Hip 90/90 Mobility',sets:'2 min each side',rpe:'rpe-l',rf:'Breathe into it',rest:0,next:'Done',
       desc:'Both legs at 90 degrees — front leg internally rotated — back leg externally rotated. Breathe and progressively sink deeper. Never force. This develops the hip external rotation that your guard work will demand. The most important BJJ mobility exercise available.',
       prog:'Progress → weighted 90/90 with 10lb DB on knee · then transition between sides',
       tag:'mb'}
    ]
  }
};

function countEx(s){return DATA[s].exercises.length;}
function countDone(s){
  var t=0;
  DATA[s].exercises.forEach(function(_,i){if(done[s+'-'+i])t++;});
  return t;
}

function render(s){
  var main=document.getElementById('main');
  if(s==='info'){main.innerHTML=renderInfo();return;}
  var d=DATA[s];
  var tot=countEx(s),dn=countDone(s),pct=Math.round(dn/tot*100);

  var clr=s==='mon'?'var(--ac)':s==='wed'?'var(--blu)':'var(--ora)';
  var pfCls='pf-'+s;

  var h='<div style="padding:12px 14px">';
  // Session header
  h+='<div class="sess-hd '+s+'">';
  h+='<div class="sess-day '+s+'">'+d.label+'</div>';
  h+='<div class="sess-title">'+d.sub+'</div>';
  h+='<div class="sess-pills">';
  d.eq.forEach(function(e){h+='<span style="font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.05);color:var(--mt);border:1px solid var(--bd)">'+e+'</span>';});
  h+='</div>';
  h+='<div class="prog-row"><span>Progress</span><span id="plbl">'+dn+' / '+tot+'</span></div>';
  h+='<div class="prog-bar"><div class="prog-fill '+pfCls+'" id="pfill" style="width:'+pct+'%"></div></div>';
  h+='</div>';

  // Exercises
  d.exercises.forEach(function(ex,i){
    var key=s+'-'+i;
    var isDone=done[key]?' done':'';
    var cls='ex';
    if(ex.tag==='ss')cls+=' superset';
    else if(ex.tag==='sk')cls+=' skill';
    else if(ex.tag==='rh')cls+=' rehab';
    else if(ex.tag==='mb')cls+=' mob';
    cls+=isDone;

    h+='<div id="ec'+key+'" class="'+cls+'">';
    h+='<div class="ex-inner">';
    h+='<div class="ex-n">'+(i+1)+'</div>';
    h+='<div class="ex-body">';
    if(ex.tag==='ss')h+='<span class="tag t-ss">Superset</span>';
    if(ex.tag==='sk')h+='<span class="tag t-sk">Skill</span>';
    if(ex.tag==='rh')h+='<span class="tag t-rh">Rehab</span>';
    if(ex.tag==='mb')h+='<span class="tag t-mb">Mobility</span>';
    if(ex.tag==='pw')h+='<span class="tag t-pw">Power</span>';
    h+='<div class="ex-name">'+ex.n+'</div>';
    h+='<div class="ex-desc">'+ex.desc+'</div>';
    if(ex.prog)h+='<div class="ex-prog">↑ '+ex.prog+'</div>';
    h+='</div>';
    h+='<div class="ex-right"><div class="ex-sets">'+ex.sets+'</div><span class="rpe '+ex.rpe+'">'+ex.rf+'</span></div>';
    h+='</div>';
    h+='<div class="ex-btns">';
    if(ex.rest>0){
      h+='<button class="btn-rest" onclick="startT('+ex.rest+',\''+ex.next.replace(/'/g,"\\'")+'\')" >Rest '+fmtR(ex.rest)+'</button>';
    }else{
      h+='<button class="btn-rest" style="opacity:.25;cursor:default">No rest</button>';
    }
    h+='<button class="btn-done" onclick="markDone(\''+key+'\',\''+s+'\')">✓ Done</button>';
    h+='</div></div>';
  });
  h+='</div>';
  main.innerHTML=h;
}

function renderInfo(){
  return '<div style="padding:12px 14px">'+
  '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px;margin-top:4px">'+
  '<div style="font-family:Bebas Neue,sans-serif;font-size:22px;color:var(--ac);margin-bottom:6px">Your Programme</div>'+
  '<div style="font-size:13px;color:#888;line-height:1.6">Monday Lower · Wednesday Upper · Friday Power. Train fresh — no BJJ yet. Full load all three sessions. 3 to 4 months to build a genuine strength and athleticism foundation before Island Flow starts.</div>'+
  '</div>'+
  '<div class="sec">Weekly Structure</div>'+
  '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:10px">'+
  mkDayRow('Monday','Lower Body + Core · ~55 min','var(--ac)')+
  mkDayRow('Tuesday','Rest','var(--bd)')+
  mkDayRow('Wednesday','Upper Body + Calisthenics · ~55 min','var(--blu)')+
  mkDayRow('Thursday','Rest','var(--bd)')+
  mkDayRow('Friday','Power + Skill + Rehab · ~50 min','var(--ora)')+
  mkDayRow('Saturday','Rest','var(--bd)')+
  mkDayRow('Sunday','Complete rest','var(--bd)',true)+
  '</div>'+
  '<div class="sec">Equipment</div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
  mkEq('2×35lb Dumbbells','Primary load — 70lbs bilateral')+
  mkEq('1×20lb Dumbbell','Turkish get-ups · curls')+
  mkEq('Doorway Pull-Up Bar','All pulling and lever work')+
  mkEq('Resistance Bands','Face pulls · band pull-aparts')+
  mkEq('Sofa or Chair','Nordic curls · BSS · hip thrust')+
  mkEq('Towel','Towel pull-ups · grip work')+
  '</div>'+
  '<div class="sec">Progressive Overload System</div>'+
  '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px">'+
  '<div style="font-size:13px;color:#888;line-height:1.7">Since dumbbells cap at 70lbs progression comes from harder exercise variations — not more weight. Every exercise card shows the next harder version. When current variation feels like 1–2 RIR consistently for two sessions — move to the next progression.<br><br><span style="color:var(--ac)">Pull-up ladder —</span> BW → 20lb → 35lb → towel weighted → archer pull-up → one arm assisted<br><br><span style="color:var(--ac)">Pike push-up ladder —</span> feet on sofa → feet higher → wall HSPU negative → wall HSPU → deficit HSPU<br><br><span style="color:var(--ac)">Pistol squat ladder —</span> assisted → unassisted → 20lb DB → 35lb DB<br><br><span style="color:var(--ac)">Dragon flag ladder —</span> tuck → single leg → full → 2 sec pause</div>'+
  '</div>'+
  '<div class="sec">RIR Guide</div>'+
  '<div style="background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px">'+
  '<div style="font-size:13px;color:#888;line-height:1.7"><span style="color:var(--red)">Stop when form breaks</span> — not when you physically cannot continue. On most exercises stop 1–2 reps before true failure. On pull-ups you can push closer to failure — safe to drop off the bar. Never ego-rep through bad form on deadlifts or split squats.</div>'+
  '</div>'+
  '<div class="sec">Big Toe Tendinitis Protocol</div>'+
  '<div style="background:var(--s1);border:1px solid rgba(255,68,68,.3);border-radius:14px;padding:14px;margin-bottom:10px">'+
  '<div style="font-size:13px;color:#888;line-height:1.7">BSS — front foot FLAT not on toes every session. Calf raises — reduce range if sharp pain at top. Tiptoe farmer walks — drop to flat foot if sharp pain returns. Rehab exercises every Friday without exception. Consistent weekly rehab now prevents chronic issues when BJJ starts and you are on the mats loading your feet daily.</div>'+
  '</div>'+
  '</div>';
}

function mkDayRow(day,sub,color,last){
  return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:'+(last?'none':'1px solid rgba(255,255,255,.04)')+'">' +
  '<div style="width:8px;height:8px;border-radius:50%;background:'+color+';flex-shrink:0"></div>'+
  '<div><div style="font-size:13px;font-weight:600;color:var(--tx)">'+day+'</div>'+
  '<div style="font-size:11px;color:var(--mt);margin-top:1px">'+sub+'</div></div></div>';
}

function mkEq(name,desc){
  return '<div style="background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px">'+
  '<div style="font-size:12px;font-weight:600;color:var(--tx);margin-bottom:2px">'+name+'</div>'+
  '<div style="font-size:10px;color:var(--mt)">'+desc+'</div></div>';
}

function fmtR(s){
  if(s>=60&&s%60===0)return(s/60)+'min';
  if(s>=60)return Math.floor(s/60)+'m'+(s%60)+'s';
  return s+'s';
}

function go(s){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active')});
  document.getElementById('nb-'+s).classList.add('active');
  render(s);
  document.getElementById('main').scrollTop=0;
}

function markDone(key,s){
  done[key]=true;
  var card=document.getElementById('ec'+key);
  if(card)card.classList.add('done');
  var tot=countEx(s),dn=countDone(s),pct=Math.round(dn/tot*100);
  var fill=document.getElementById('pfill');
  var lbl=document.getElementById('plbl');
  if(fill)fill.style.width=pct+'%';
  if(lbl)lbl.textContent=dn+' / '+tot;
  showN('Exercise done ✓');
  if(dn===tot)setTimeout(function(){showN('Session complete 🔥');},700);
}

function startT(secs,next){
  tTotal=secs;tSecs=secs;
  document.getElementById('tsec').textContent=secs;
  document.getElementById('tnxt').textContent='Next: '+next;
  document.getElementById('tarc').style.strokeDashoffset='0';
  document.getElementById('tov').classList.add('show');
  clearInterval(tInt);
  tInt=setInterval(function(){
    tSecs--;
    document.getElementById('tsec').textContent=tSecs;
    document.getElementById('tarc').style.strokeDashoffset=C*(1-tSecs/tTotal);
    if(tSecs<=0){stopT();showN('Rest done — go!');}
  },1000);
}

function stopT(){clearInterval(tInt);document.getElementById('tov').classList.remove('show');}

function showN(msg){
  var n=document.getElementById('notif');
  n.textContent=msg;n.classList.add('show');
  setTimeout(function(){n.classList.remove('show');},2400);
}

render('mon');
</script>
</body>
</html>
